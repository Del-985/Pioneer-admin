name: Verify Pioneer Admin

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Install browser test driver
        run: npm install --no-save playwright
      - name: Smoke test field operations
        run: node .github/scripts/smoke-field-admin.cjs
      - name: Build isolated sandbox UI
        run: VITE_APP_ENV=sandbox VITE_API_BASE_URL=same-origin npm run build
      - name: Verify sandbox UI isolation
        run: node .github/scripts/smoke-sandbox.cjs
