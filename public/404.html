<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pioneer Admin</title>
    <script>
      (function () {
        var location = window.location;
        var route = location.pathname.slice(1);
        var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';

        location.replace(
          location.protocol +
            '//' +
            location.host +
            '/?/' +
            route.replace(/&/g, '~and~') +
            query +
            location.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
